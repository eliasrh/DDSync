name: MATLAB tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('DDSync/test'); run_tests
