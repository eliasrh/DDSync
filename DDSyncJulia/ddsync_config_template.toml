# ddsync_config_template.toml
#
# Copy to "ddsync_config.toml" and edit.
# The runner (run_ddsync.jl) will automatically load ddsync_config.toml if present,
# or you can pass a TOML file explicitly:
#   julia run_ddsync.jl myconfig.toml
#   julia run_ddsync.jl myconfig.toml dt.cc catalog.txt
#
# Any fields you omit will fall back to DDSync.config_default().
# Paths are relative to your working directory, not this TOML file.
# Use a separate output directory per run; matching outputs are overwritten.

[io]
# infile_dt = "dt.cc"
# catalog_file = "catalog.txt"
# tmpdir = "ddsync_tmp"
# thetadir = "theta"
# thetastd_dir = "thetastd"
# metrics_file = "sync_metrics.txt"
# out_dt_sync = "dt_sync.cc"

[weights]
# Base weight from dt.cc "cc" column
# base_mode = "cc"      # "cc" | "cc2" | "ones"

[robust]
# K_SIGMA = 20.0
# MIN_EDGES = 30
# min_scale = 5e-4   # robust scale floor for pruning/IRLS only

[irls]
# iters = 10
# C_HUBER = 1.345
# rel_tol = 1e-3

[numeric]
# RIDGE_EPS = 1e-10

[output]
# write_dt_sync = true
# weight_mode = "thetaStd"     # "base" | "robust" | "combined" | "thetaStd"
# write_pruned_edges = false
#
# thetaStd scaling (only used when weight_mode = "thetaStd")
# thetastd_scale_mode = "fixed"   # "fixed" | "median"
# thetastd_scale_fixed = 500.0
# thetastd_weight_cap = 1.0
#
# Formatting (match MATLAB standalone defaults as needed)
# dt_decimals = 5
# dt_weight_decimals = 4
# theta_decimals = 9
# thetastd_decimals = 9
# station_field_width = 8
# dt_field_width = 10
# weight_field_width = 8

[std]
export = true
# Each connected group is timed relative to one reference event.
mode = "auto"                 # Calculate small groups exactly. Sample larger groups.
# If many Hutch estimates miss the target, try Cholesky before increasing probes.
auto_probe = "hutch"          # Change to "cholesky" to use squared draws for larger groups.
exact_max_nred = 2048         # Largest number of non-reference events for a fully exact calculation.
# Set mode to "hutch" or "cholesky" to sample even small groups.

# Cholesky first checks at 256 draws, then 512, 1024 and so on, up to probes.
# It calculates the variance of one shared timing shift directly.
# Hutchinson checks after each batch once it has collected min_probes.
probes = 4096                 # Maximum draws per group. Zero skips sampling.
min_probes = 128              # Minimum draws to accept a sampled value. Above 256 this also delays Cholesky's first check.
rel_tol = 0.10                # Stop when every event's estimated sampling error is at most 10% of its variance.
probe_dist = "rademacher"     # Random signs (+1 or -1). "gaussian" draws normal random numbers.
batch = 128                   # Vectors solved at once. Smaller batches need less working memory.
report_every_batch = 10       # Print progress every 10 batches. Zero turns progress messages off.
max_nred = 40000              # Use fallback above this many non-reference events in one group.

repair_max_nodes = 128        # At the limit, calculate up to 128 troublesome event variances exactly.
unconverged = "keep"          # Retain usable positive estimates, flagged per event. "fallback" replaces them.
fallback = "pseudo_degree"    # Approximate remaining errors from each event's number of connections.
# With pseudo_degree, four connections give an approximate timing error equal to half the timing scatter.
# A sampled variance must be positive and finite, with enough draws and sampling error
# below the variance itself, to qualify for "keep". See sync_metrics.txt for percentages
# and std_quality_*.txt for each event's method. See ../docs/uncertainty.md for details.

# After fitting, DDSync compares each retained measured differential travel time
# with theta_i - theta_j. sigma_hat is the scatter of these mismatches, in seconds,
# estimated separately for each connected group at one station and phase.
# The uncertainty calculation uses sigma_std = max(sigma_hat, min_sigma) when enabled.
# Combining observations can give std_theta below min_sigma; this is not a minimum std_theta.
min_sigma = 5e-4             # use at least 0.5 ms for the scatter of these travel-time mismatches
apply_min_sigma = true       # false (or min_sigma=0) uses sigma_hat without imposing this minimum
# min_diag_rel = 1e-12        # deprecated and ignored; no clipping of failed variances

# For pseudo_weight (and optional alt column): per-node weight estimated from incident edges.
# pseudo_weight_source = "combined"   # "base" | "robust" | "combined"
# pseudo_weight_eps = 1e-6

# Columns written to std_theta files
# thetastd_write_weightcol = true
# thetastd_write_alt_node_weightcol = false

[runtime]
# Memory policy: dense arrays like MATLAB (fast, memory heavy) vs sparse Dict (memory light)
# store_dense_group_arrays = false

prog_every_lines = 2000000
# decision_chunk_records = 200000
# median_scale_cap = 2000000
